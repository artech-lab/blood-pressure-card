# Every option. All of them are optional.
type: custom:blood-pressure-card
systolic_entity: sensor.monitor_systolic    # default: found automatically
diastolic_entity: sensor.monitor_diastolic  # default: found automatically
pulse_entity: sensor.monitor_pulse          # default: found on the same device
guideline: esh_2023        # esh_2023, esc_2024 or acc_aha_2025 (default: esh_2023, acc_aha_2025 in the US)
title: Blood pressure      # default: "Blood pressure", localized
icon: mdi:heart-pulse
history_days: 30           # 7-365
show_history: true
show_average: true
show_reference: true
# Optional helpers ("Create helpers" in the editor, or examples/packages/blood_pressure.yaml)
last_entity: input_datetime.blood_pressure_last_measurement
systolic_today_entity: sensor.blood_pressure_systolic_today
diastolic_today_entity: sensor.blood_pressure_diastolic_today
